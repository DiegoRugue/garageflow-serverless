name: Serverless quality gate

on:
  workflow_call:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    name: Build, test, and validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out protected source
        uses: actions/checkout@v4

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - name: Install pinned Python test dependencies
        run: python -m pip install --require-hashes --requirement scripts/requirements-test.txt

      - name: Build with warnings as errors
        run: dotnet build GarageFlow.Serverless.slnx --configuration Release --warnaserror

      - name: Run unit tests
        run: dotnet test Tests/Unit/GarageFlow.Serverless.Tests.Unit.csproj --configuration Release --no-build

      - name: Run integration tests
        run: dotnet test Tests/Integration/GarageFlow.Serverless.Tests.Integration.csproj --configuration Release --no-build

      - name: Enforce meaningful .NET line coverage
        shell: bash
        run: |
          dotnet test GarageFlow.Serverless.slnx \
            --configuration Release \
            --no-build \
            --settings coverlet.runsettings \
            --collect:"XPlat Code Coverage" \
            --results-directory "$RUNNER_TEMP/dotnet-coverage"
          python - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as element_tree

          reports = glob.glob("%s/**/coverage.cobertura.xml" % __import__("os").environ["RUNNER_TEMP"], recursive=True)
          if not reports:
              raise SystemExit("no .NET coverage reports were produced")
          covered = valid = 0
          for report in reports:
              root = element_tree.parse(report).getroot()
              covered += int(root.attrib["lines-covered"])
              valid += int(root.attrib["lines-valid"])
          rate = covered / valid if valid else 0
          print(f"Combined .NET line coverage: {rate:.2%} ({covered}/{valid})")
          if rate < 0.80:
              raise SystemExit(".NET line coverage is below 80%")
          PY

      - name: Run Python tests with branch coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/garageflow-serverless.coverage
        run: |
          python -m coverage erase
          python -m coverage run --branch --source=scripts --omit="scripts/tests/*" -m unittest discover -s scripts/tests -p "test_*.py"
          python -m coverage report --show-missing --fail-under=80

      - name: Check Terraform formatting
        run: terraform -chdir=infra/serverless fmt -check -recursive

      - name: Initialize and validate Terraform without a backend
        run: |
          terraform -chdir=infra/serverless init -backend=false -input=false
          terraform -chdir=infra/serverless validate

      - name: Run Terraform mock-provider tests
        run: terraform -chdir=infra/serverless test -no-color

      - name: Check deployment shell syntax
        run: bash -n scripts/deploy-serverless.sh

      - name: Validate GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

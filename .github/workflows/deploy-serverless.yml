name: Deploy serverless authentication

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Protected environment to recover
        required: true
        type: choice
        options:
          - homologation
          - production
      confirm_commit:
        description: Full commit SHA expected at the selected protected ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: serverless-${{ github.ref_name == 'main' && 'production' || 'homologation' }}
  cancel-in-progress: false

jobs:
  quality-gate:
    uses: ./.github/workflows/quality-gate.yml

  deploy:
    name: Deploy ${{ github.ref_name == 'main' && 'production' || 'homologation' }}
    needs: quality-gate
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'main' && 'production' || 'homologation' }}
    outputs:
      environment: ${{ steps.target.outputs.environment }}

    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_OWNER: ${{ vars.TF_OWNER }}
      TF_EXPIRES_ON: ${{ vars.TF_EXPIRES_ON }}
      AUTHENTICATION_ROLE_ARN: ${{ secrets.AUTHENTICATION_ROLE_ARN }}
      AUTHORIZER_ROLE_ARN: ${{ secrets.AUTHORIZER_ROLE_ARN }}
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out the protected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Resolve and guard deployment target
        id: target
        shell: bash
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
          CONFIRM_COMMIT: ${{ inputs.confirm_commit }}
        run: |
          if [[ "$GITHUB_REF_NAME" == "main" ]]; then
            expected_environment="production"
          elif [[ "$GITHUB_REF_NAME" == "develop" ]]; then
            expected_environment="homologation"
          else
            printf 'Deployment requires main or develop.\n' >&2
            exit 2
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$REQUESTED_ENVIRONMENT" == "$expected_environment" ]]
            [[ "$CONFIRM_COMMIT" == "$GITHUB_SHA" ]]
          fi
          printf 'environment=%s\n' "$expected_environment" >> "$GITHUB_OUTPUT"

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - name: Install pinned contract dependencies
        run: python -m pip install --require-hashes --requirement scripts/requirements-test.txt

      - name: Deploy and publish the serverless contract
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ steps.target.outputs.environment }}
        run: bash scripts/deploy-serverless.sh --environment "$DEPLOYMENT_ENVIRONMENT"

  deploy-edge-production:
    needs: deploy
    if: github.ref == 'refs/heads/main' && needs.deploy.outputs.environment == 'production'
    uses: DiegoRugue/garageflow-infra-kubernetes/.github/workflows/deploy-edge.yml@main
    secrets: inherit
    with:
      component: edge

  deploy-edge-homologation:
    needs: deploy
    if: github.ref == 'refs/heads/develop' && needs.deploy.outputs.environment == 'homologation'
    uses: DiegoRugue/garageflow-infra-kubernetes/.github/workflows/deploy-edge.yml@main
    secrets: inherit
    with:
      component: edge
